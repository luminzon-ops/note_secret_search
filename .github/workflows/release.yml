name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.5"
  JAVA_VERSION: "17"

jobs:
  release-preflight:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      notes_file: ${{ steps.metadata.outputs.notes_file }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag, version, and release notes
        id: metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          git fetch --force --tags origin master
          $tagSha = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          $masterSha = (git rev-parse 'origin/master^{commit}').Trim()
          if ([string]::IsNullOrWhiteSpace($tagSha) -or
              [string]::IsNullOrWhiteSpace($masterSha)) {
            throw 'Unable to resolve release tag or origin/master.'
          }
          git merge-base --is-ancestor $tagSha $masterSha
          if ($LASTEXITCODE -ne 0 -or $tagSha -ne $masterSha) {
            throw 'Release tag must point to the current origin/master merge commit.'
          }
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)\s*$') {
            throw 'Unable to parse pubspec version.'
          }
          $versionName = $matches[1]
          $versionCode = [int]$matches[2]
          $policy = Get-Content config/release/release_artifact_policy.json -Raw |
            ConvertFrom-Json
          if ($env:RELEASE_TAG -ne "v$versionName" -or
              $policy.tag -ne $env:RELEASE_TAG -or
              $policy.versionName -ne $versionName -or
              [int]$policy.versionCode -ne $versionCode) {
            throw 'Release tag, pubspec, and artifact policy do not match.'
          }
          $notesFile = "docs/release/$($env:RELEASE_TAG)-release-notes.md"
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) {
            throw "Release notes are missing: $notesFile"
          }
          $ledgerFile = "docs/release/$($env:RELEASE_TAG)-release-ledger.md"
          if (-not (Test-Path -LiteralPath $ledgerFile -PathType Leaf)) {
            throw "Release ledger is missing: $ledgerFile"
          }
          $ledger = Get-Content -LiteralPath $ledgerFile -Raw
          if ($ledger -match '(?im)^\s*-\s*.*\bpending\b') {
            throw "Release ledger still contains pending evidence: $ledgerFile"
          }
          "release_tag=$($env:RELEASE_TAG)" >> $env:GITHUB_OUTPUT
          "notes_file=$notesFile" >> $env:GITHUB_OUTPUT

  source-draft:
    name: Create source-only draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: vars.NSS_FORMAL_RELEASE_ENABLED != 'true'
    needs: release-preflight
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-preflight.outputs.release_tag }}

      - name: Create source-only draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.release-preflight.outputs.release_tag }}" \
            --draft \
            --title "${{ needs.release-preflight.outputs.release_tag }}" \
            --notes-file "${{ needs.release-preflight.outputs.notes_file }}"

  formal-package:
    name: Package formal release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: vars.NSS_FORMAL_RELEASE_ENABLED == 'true'
    needs: release-preflight
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-preflight.outputs.release_tag }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare Flutter Android version
        shell: pwsh
        run: ./scripts/quality/Prepare-FlutterAndroidVersion.ps1 -RepoRoot "$PWD"

      - name: Package Android artifacts
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Audit Android artifacts
        shell: pwsh
        run: |
          ./scripts/quality/Invoke-AndroidArtifactAudit.ps1 `
            -RepoRoot "$PWD" `
            -DebugApkPath build/app/outputs/flutter-apk/app-debug.apk `
            -AndroidTestApkPath build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk `
            -ReleaseApkPath build/app/outputs/flutter-apk/app-release.apk `
            -ReleaseAabPath build/app/outputs/bundle/release/app-release.aab

      - name: Collect formal release inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/android/app-release.apk
          cp build/app/outputs/bundle/release/app-release.aab artifacts/android/app-release.aab

      - name: Upload formal release inputs
        uses: actions/upload-artifact@v4
        with:
          name: formal-release-inputs
          path: artifacts/android
          retention-days: 14

  sign-formal:
    name: Sign formal release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: vars.NSS_FORMAL_RELEASE_ENABLED == 'true'
    needs:
      - release-preflight
      - formal-package
    environment: release-signing
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-preflight.outputs.release_tag }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download formal release inputs
        uses: actions/download-artifact@v4
        with:
          name: formal-release-inputs
          path: artifacts/android

      - name: Sign and verify formal release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NSS_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NSS_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NSS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NSS_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.NSS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p signed
          keystore="$RUNNER_TEMP/nss-release.jks"
          trap 'rm -f "$keystore"' EXIT
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          expected_cert=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          if [[ ! "$expected_cert" =~ ^[0-9a-f]{64}$ ||
                "$expected_cert" == "unsetreleasecertificatesha256" ]]; then
            echo 'NSS_RELEASE_CERT_SHA256 must be a configured 64-character SHA-256 digest.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ]; then
            sdkmanager_path="$(command -v sdkmanager)"
            sdk_root="$(cd "$(dirname "$sdkmanager_path")/../../.." && pwd)"
          fi
          test -d "$sdk_root/build-tools"
          build_tools_dir=$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)
          test -n "$build_tools_dir"
          zipalign="$build_tools_dir/zipalign"
          apksigner="$build_tools_dir/apksigner"
          test -f "$zipalign"
          test -f "$apksigner"
          test -x "$zipalign"
          test -x "$apksigner"
          "$zipalign" -p -f 4 artifacts/android/app-release.apk signed/app-release-aligned.apk
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out signed/app-release-signed.apk \
            signed/app-release-aligned.apk
          "$apksigner" verify --print-certs signed/app-release-signed.apk \
            > signed/app-release-apk-certs.txt
          jarsigner \
            -keystore "$keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -signedjar signed/app-release-signed.aab \
            artifacts/android/app-release.aab \
            "$KEY_ALIAS"
          jarsigner -verify -verbose -certs signed/app-release-signed.aab \
            > signed/app-release-aab-certs.txt
          keytool -printcert -jarfile signed/app-release-signed.aab \
            > signed/app-release-aab-fingerprint.txt
          apk_cert=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {
            print $2; exit
          }' signed/app-release-apk-certs.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          aab_cert=$(awk -F': *' '/SHA-?256:/ {
            print $2; exit
          }' signed/app-release-aab-fingerprint.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          if [[ ! "$apk_cert" =~ ^[0-9a-f]{64}$ ||
                ! "$aab_cert" =~ ^[0-9a-f]{64}$ ||
                "$apk_cert" != "$expected_cert" ||
                "$aab_cert" != "$expected_cert" ]]; then
            echo 'Signed APK/AAB certificate does not match NSS_RELEASE_CERT_SHA256.' >&2
            exit 1
          fi
          sha256sum signed/app-release-signed.apk signed/app-release-signed.aab \
            > signed/SHA256SUMS

      - name: Upload signed formal release
        uses: actions/upload-artifact@v4
        with:
          name: signed-formal-release
          path: signed
          retention-days: 30

      - name: Attest signed formal release
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            signed/app-release-signed.apk
            signed/app-release-signed.aab

  publish-formal:
    name: Publish formal draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: vars.NSS_FORMAL_RELEASE_ENABLED == 'true'
    needs:
      - release-preflight
      - sign-formal
    environment: release-publish
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-preflight.outputs.release_tag }}

      - name: Download signed formal release
        uses: actions/download-artifact@v4
        with:
          name: signed-formal-release
          path: signed

      - name: Create formal draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.release-preflight.outputs.release_tag }}" \
            signed/app-release-signed.apk \
            signed/app-release-signed.aab \
            --draft \
            --title "${{ needs.release-preflight.outputs.release_tag }}" \
            --notes-file "${{ needs.release-preflight.outputs.notes_file }}"
