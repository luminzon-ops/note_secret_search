name: note_secret_search
description: Android-first private password manager and notes app with local AI search.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.5'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.7.0
  crypto: ^3.0.3
  uuid: ^4.5.1
  path: ^1.9.0
  path_provider: ^2.1.4
  pointycastle: 4.0.0
  sqflite_sqlcipher: ^3.0.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common: 2.5.6
  sqflite_common_ffi: 2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/model_catalog/
    - assets/model_catalog/tokenizers/
